<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Decorative Trays & Home Decor Wholesaler in Delhi | Divine Home India</title>
    <meta name="description" content="Wholesale decorative trays, mango wood, ceramics and corporate gifts from Karol Bagh, New Delhi. Supplying dealers and distributors across India since 2015." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Divine Home India" />
    <meta property="og:image" content="https://www.divinehomeindia.com/logo-header.png" />
    <meta name="theme-color" content="#211c17" />
    <style>
      /* Opening gate: painted with the first HTML byte so the page never flashes unstyled text */
      #dhi-gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;pointer-events:none;animation:dhiGateFailsafe .6s ease 7s forwards}
      #dhi-gate .g-l,#dhi-gate .g-r{position:absolute;top:0;width:50.5%;height:100%;background:#1c1917;transition:transform .9s cubic-bezier(.77,0,.175,1)}
      #dhi-gate .g-l{left:0;border-right:1px solid rgba(197,160,89,.35);background:linear-gradient(90deg,#0f0d0c,#1c1917)}
      #dhi-gate .g-r{right:0;border-left:1px solid rgba(197,160,89,.35);background:linear-gradient(270deg,#0f0d0c,#1c1917)}
      #dhi-gate .g-in{position:relative;z-index:2;text-align:center;color:#fff;transition:opacity .45s ease,transform .6s ease,filter .45s ease}
      #dhi-gate .g-mark{width:64px;height:64px;margin:0 auto 22px;border:1px solid rgba(197,160,89,.55);border-radius:16px;display:flex;align-items:center;justify-content:center;font:700 26px/1 Georgia,serif;color:#C5A059;background:rgba(255,255,255,.06);animation:dhiFloat 2.6s ease-in-out infinite}
      #dhi-gate .g-name{font:700 clamp(22px,5vw,46px)/1.1 Georgia,'Libre Caslon Text',serif;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
      #dhi-gate .g-name b{color:#C5A059;font-weight:700}
      #dhi-gate .g-sub{margin-top:14px;font:500 11px/1.4 system-ui,sans-serif;letter-spacing:.35em;text-transform:uppercase;color:#a8a29e}
      #dhi-gate .g-bar{width:140px;height:1px;margin:22px auto 0;background:rgba(197,160,89,.25);overflow:hidden}
      #dhi-gate .g-bar i{display:block;height:100%;width:40%;background:#C5A059;animation:dhiBar 1.1s ease-in-out infinite}
      #dhi-gate.open .g-l{transform:translateX(-101%)}
      #dhi-gate.open .g-r{transform:translateX(101%)}
      #dhi-gate.open .g-in{opacity:0;transform:scale(1.08);filter:blur(3px)}
      @keyframes dhiFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes dhiBar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
      @keyframes dhiGateFailsafe{to{opacity:0;visibility:hidden}}
      @media (prefers-reduced-motion:reduce){#dhi-gate .g-mark,#dhi-gate .g-bar i{animation:none}#dhi-gate .g-l,#dhi-gate .g-r{transition-duration:.01s}}
    </style>
  </head>
  <body>
    <div id="dhi-gate" aria-hidden="true"><div class="g-l"></div><div class="g-r"></div><div class="g-in"><div class="g-mark">D</div><div class="g-name">Divine <b>Home</b> India</div><div class="g-sub">Karol Bagh, New Delhi &middot; Since 2015</div><div class="g-bar"><i></i></div></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
