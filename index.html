    <title>Decorative Trays & Home Decor Wholesaler in Delhi | Divine Home India</title>
    <meta name="description" content="Wholesale decorative trays, mango wood, ceramics and corporate gifts from Karol Bagh, New Delhi. Supplying dealers and distributors across India since 2015." />

    <style>
      /* Opening gate (painted with the first HTML byte, opened by src/components/Preloader.jsx).
         The round DH seal is split down the middle: one half on each door, so it parts as the doors swing open. */
      #dhi-gate{--m:min(210px,48vw);--cy:42vh;position:fixed;inset:0;z-index:9999;overflow:hidden;pointer-events:none;perspective:1800px;animation:dhiFailsafe .6s ease 8s forwards}
      #dhi-gate .g-door{position:absolute;top:0;width:50.2%;height:100%;overflow:hidden;transition:transform 1.3s cubic-bezier(.65,0,.2,1) .15s,filter 1.3s ease .15s;will-change:transform;
        background:radial-gradient(120% 70% at var(--sx) 42%,rgba(228,30,37,.36),transparent 60%),radial-gradient(90% 60% at var(--sx) 0%,rgba(14,124,123,.35),transparent 65%),radial-gradient(90% 60% at var(--sx) 100%,rgba(43,58,140,.45),transparent 65%),linear-gradient(160deg,#1a0b1f 0%,#2a0d22 45%,#12091a 100%)}
      #dhi-gate .g-door::before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(62% 62% at var(--sx) 52%,rgba(16,7,14,.86),rgba(16,7,14,.35) 68%,transparent),linear-gradient(180deg,rgba(16,7,14,.55),rgba(16,7,14,.15) 35%,rgba(16,7,14,.2) 65%,rgba(16,7,14,.7))}
      #dhi-gate .g-photo{position:absolute;top:0;height:100%;width:100vw;max-width:none;object-fit:cover;object-position:50% 55%;opacity:0;transition:opacity .7s ease;animation:dhiKen 7s ease-out both}
      #dhi-gate .g-photo.on{opacity:1}
      #dhi-gate .g-l .g-photo{left:0}#dhi-gate .g-r .g-photo{right:0}
      #dhi-gate .g-l{left:0;--sx:100%;transform-origin:0 50%;border-right:1px solid rgba(255,230,180,.28)}
      #dhi-gate .g-r{right:0;--sx:0%;transform-origin:100% 50%;border-left:1px solid rgba(255,230,180,.28)}
      #dhi-gate .g-seal{position:absolute;z-index:4;top:calc(var(--cy) - var(--m) / 2);width:var(--m);height:var(--m);border-radius:50%;display:flex;align-items:center;justify-content:center;
        background:radial-gradient(circle at 35% 30%,#fffdf7,#f6ecd8 70%,#e9d9b8);border:0;box-shadow:0 0 0 1px rgba(232,176,75,.75),0 0 0 7px rgba(255,248,235,.08),0 24px 60px rgba(0,0,0,.5);
        animation:dhiSeal 1.1s cubic-bezier(.2,.8,.2,1) .1s both}
      #dhi-gate .g-l .g-seal{right:calc(var(--m) / -2)}
      #dhi-gate .g-r .g-seal{left:calc(var(--m) / -2)}
      #dhi-gate .g-seal img{width:76%;height:auto;margin-top:-3%}
      #dhi-gate .g-seal::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.95) 50%,transparent 62%) -160% 0/260% 100% no-repeat;mix-blend-mode:soft-light;animation:dhiSweep 1.3s ease 1s both}
      #dhi-gate .g-halo{position:absolute;z-index:3;left:50%;top:var(--cy);width:calc(var(--m) + 30px);height:calc(var(--m) + 30px);border-radius:50%;transform:translate(-50%,-50%);
        background:conic-gradient(from 0deg,#E41E25,#E8B04B,#0E7C7B,#2B3A8C,#B0157A,#E41E25);-webkit-mask:radial-gradient(closest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));mask:radial-gradient(closest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px));
        filter:drop-shadow(0 0 10px rgba(232,176,75,.6));animation:dhiSpin 4s linear infinite,dhiHaloIn .9s ease .6s both;transition:opacity .5s ease,transform .8s ease}
      #dhi-gate .g-aura{position:absolute;z-index:0;left:50%;top:var(--cy);width:calc(var(--m) * 2.6);height:calc(var(--m) * 2.6);border-radius:50%;transform:translate(-50%,-50%);filter:blur(50px);opacity:.5;
        background:conic-gradient(from 90deg,#E41E25,#E8B04B,#0E7C7B,#2B3A8C,#B0157A,#E41E25);animation:dhiSpin 9s linear infinite reverse}
      #dhi-gate .g-in{position:absolute;z-index:3;left:0;right:0;top:calc(var(--cy) + var(--m) / 2 + 38px);display:flex;flex-direction:column;align-items:center;transition:opacity .5s ease,transform .8s ease}
      #dhi-gate .g-word{width:min(360px,74vw);height:auto;filter:drop-shadow(0 4px 16px rgba(0,0,0,.6));clip-path:inset(0 100% 0 0);animation:dhiWord 1s cubic-bezier(.6,0,.2,1) .75s forwards}
      #dhi-gate .g-line{width:0;height:1px;margin:16px 0 12px;background:linear-gradient(90deg,transparent,#E8B04B,transparent);animation:dhiLine .9s ease 1.1s forwards}
      #dhi-gate .g-sub{font:600 11px/1.4 'Instrument Sans',system-ui,sans-serif;letter-spacing:.38em;text-transform:uppercase;padding-left:.38em;text-align:center;
        background:linear-gradient(90deg,#c9a24a,#ffe3a3,#c9a24a);-webkit-background-clip:text;background-clip:text;color:transparent;animation:dhiFade .8s ease 1.3s both}
      @media (max-width:820px){#dhi-gate .g-sub{font-size:10px;letter-spacing:.26em;padding-left:.26em}}
      #dhi-gate.open .g-l{transform:rotateY(-100deg);filter:brightness(.6)}
      #dhi-gate.open .g-r{transform:rotateY(100deg);filter:brightness(.6)}
      #dhi-gate.open .g-halo{opacity:0;transform:translate(-50%,-50%) scale(1.6)}
      #dhi-gate.open .g-in{opacity:0;transform:translateY(14px)}
      #dhi-gate.open .g-aura{opacity:0;transition:opacity .5s}
      @keyframes dhiSeal{from{opacity:0;transform:scale(.55) rotate(-200deg);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
      @keyframes dhiKen{from{transform:scale(1.12)}to{transform:scale(1)}}
      @keyframes dhiSweep{to{background-position:160% 0}}
      @keyframes dhiSpin{to{transform:translate(-50%,-50%) rotate(360deg)}}
      @keyframes dhiHaloIn{from{opacity:0}}
      @keyframes dhiWord{to{clip-path:inset(0 0 0 0)}}
      @keyframes dhiLine{to{width:min(260px,60vw)}}
      @keyframes dhiFade{from{opacity:0;transform:translateY(6px)}}
      @keyframes dhiFailsafe{to{opacity:0;visibility:hidden}}
      @media (prefers-reduced-motion:reduce){#dhi-gate *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}#dhi-gate .g-door{transition-duration:.3s}}
    </style>
  </head>
  <body>
    <div id="dhi-gate" aria-hidden="true"><div class="g-aura"></div><div class="g-door g-l"><img class="g-photo" src="/images/site/w/gate-bg-1600.webp" srcset="/images/site/w/gate-bg-960.webp 960w, /images/site/w/gate-bg-1600.webp 1600w" sizes="100vw" alt="" width="1600" height="1067" fetchpriority="high" onload="this.classList.add('on')"><span class="g-seal"><img src="/logo-mark.webp" alt="" width="420" height="234"></span></div><div class="g-door g-r"><img class="g-photo" src="/images/site/w/gate-bg-1600.webp" srcset="/images/site/w/gate-bg-960.webp 960w, /images/site/w/gate-bg-1600.webp 1600w" sizes="100vw" alt="" width="1600" height="1067" fetchpriority="high" onload="this.classList.add('on')"><span class="g-seal"><img src="/logo-mark.webp" alt="" width="420" height="234"></span></div><div class="g-halo"></div><div class="g-in"><img class="g-word" src="/logo-word.webp" alt="" width="720" height="89"><div class="g-line"></div><div class="g-sub">Karol Bagh &middot; New Delhi &middot; Since 2015</div></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
